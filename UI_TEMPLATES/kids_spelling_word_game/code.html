<button class="letter-key h-14 bg-surface-container-lowest text-on-surface rounded-xl font-headline-md text-headline-md shadow-[0_5px_0_0_#bdcef0] active:translate-y-1 active:shadow-[0_1px_0_0_#bdcef0] transition-all flex items-center justify-center" type="button">T</button>
<button class="letter-key h-14 bg-surface-container-lowest text-on-surface rounded-xl font-headline-md text-headline-md shadow-[0_5px_0_0_#bdcef0] active:translate-y-1 active:shadow-[0_1px_0_0_#bdcef0] transition-all flex items-center justify-center" type="button">D</button>
<button class="letter-key h-14 bg-surface-container-lowest text-on-surface rounded-xl font-headline-md text-headline-md shadow-[0_5px_0_0_#bdcef0] active:translate-y-1 active:shadow-[0_1px_0_0_#bdcef0] transition-all flex items-center justify-center" type="button">O</button>
<button class="letter-key h-14 bg-surface-container-lowest text-on-surface rounded-xl font-headline-md text-headline-md shadow-[0_5px_0_0_#bdcef0] active:translate-y-1 active:shadow-[0_1px_0_0_#bdcef0] transition-all flex items-center justify-center" type="button">G</button>
<button class="letter-key h-14 bg-surface-container-lowest text-on-surface rounded-xl font-headline-md text-headline-md shadow-[0_5px_0_0_#bdcef0] active:translate-y-1 active:shadow-[0_1px_0_0_#bdcef0] transition-all flex items-center justify-center" type="button">B</button>
<!-- Backspace action button -->

<script>
  (function() {
    const letters = [];
    const maxLetters = 3;
    const correctWord = "CAT";

    const boxes = [
      document.getElementById('box-0'),
      document.getElementById('box-1'),
      document.getElementById('box-2')
    ];

    const feedbackBanner = document.getElementById('feedbackBanner');
    const feedbackText = document.getElementById('feedbackText');
    const letterKeys = document.querySelectorAll('.letter-key');
    const backspaceBtn = document.getElementById('backspaceBtn');
    const clearBtn = document.getElementById('clearBtn');
    const checkBtn = document.getElementById('checkAnswerBtn');
    const testWrongBtn = document.getElementById('testWrongBtn');
    const testRightBtn = document.getElementById('testRightBtn');
    const ttsButton = document.getElementById('ttsButton');
    const hintAudioButton = document.getElementById('hintAudioButton');

    function updateLetterDisplay() {
      boxes.forEach((box, idx) => {
        const valSpan = box.querySelector('.letter-val');
        valSpan.textContent = letters[idx] || '';
      });
      clearErrorStyles();
    }

    function clearErrorStyles() {
      boxes.forEach(box => {
        box.classList.remove('bg-error-container', 'text-on-error-container', 'translate-x-1', '-translate-x-1', 'bg-secondary-fixed');
        box.classList.add('bg-surface-container-lowest', 'text-on-surface');
        box.style.boxShadow = '0 6px 0 0 #c5d7f2';
      });
      feedbackBanner.classList.remove('opacity-100', 'bg-error-container', 'text-on-error-container', 'bg-secondary-container', 'text-on-secondary-container');
      feedbackBanner.classList.add('opacity-0');
    }

    function addLetter(char) {
      if (letters.length < maxLetters) {
        letters.push(char);
        updateLetterDisplay();
      }
    }

    function removeLetter() {
      if (letters.length > 0) {
        letters.pop();
        updateLetterDisplay();
      }
    }

    function triggerWrongState() {
      // Shake animation effect
      boxes.forEach((box, i) => {
        box.classList.remove('bg-surface-container-lowest', 'text-on-surface');
        box.classList.add('bg-error-container', 'text-on-error-container');
        box.style.boxShadow = '0 6px 0 0 #ba1a1a';
        
        // Jiggle sequence
        setTimeout(() => box.style.transform = 'translateX(-6px)', 40);
        setTimeout(() => box.style.transform = 'translateX(6px)', 90);
        setTimeout(() => box.style.transform = 'translateX(-4px)', 140);
        setTimeout(() => box.style.transform = 'translateX(4px)', 190);
        setTimeout(() => box.style.transform = 'translateX(0)', 240);
      });

      feedbackBanner.className = 'w-full min-h-[48px] rounded-xl flex items-center justify-center px-4 py-2 text-center transition-all duration-300 opacity-100 bg-error-container text-on-error-container shadow-[0_3px_0_0_#d89c9c]';
      feedbackText.innerHTML = '🐱💭 <strong>Oops! Try again!</strong> Almost there!';
    }

    function triggerCorrectState() {
      boxes.forEach(box => {
        box.classList.remove('bg-surface-container-lowest', 'text-on-surface');
        box.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
        box.style.boxShadow = '0 6px 0 0 #006399';
        box.style.transform = 'scale(1.05)';
        setTimeout(() => box.style.transform = 'scale(1)', 200);
      });

      feedbackBanner.className = 'w-full min-h-[48px] rounded-xl flex items-center justify-center px-4 py-2 text-center transition-all duration-300 opacity-100 bg-secondary-container text-on-secondary-container shadow-[0_3px_0_0_#004a75]';
      feedbackText.innerHTML = '🎉 ⭐ <strong>Awesome job!</strong> That spells CAT! ⭐ 🎉';
    }

    // Attach keyboard event listeners
    letterKeys.forEach(btn => {
      btn.addEventListener('click', () => {
        addLetter(btn.textContent.trim());
      });
    });

    backspaceBtn.addEventListener('click', removeLetter);
    
    clearBtn.addEventListener('click', () => {
      letters.length = 0;
      updateLetterDisplay();
    });

    // Check answer logic
    checkBtn.addEventListener('click', () => {
      const spelled = letters.join('');
      if (spelled.length < maxLetters) {
        feedbackBanner.className = 'w-full min-h-[48px] rounded-xl flex items-center justify-center px-4 py-2 text-center transition-all duration-300 opacity-100 bg-primary-fixed text-on-primary-fixed shadow-[0_3px_0_0_#d49b00]';
        feedbackText.innerHTML = '✏️ Tap 3 letters to spell the word!';
        return;
      }

      if (spelled === correctWord) {
        triggerCorrectState();
      } else {
        triggerWrongState();
      }
    });

    // Test Helpers
    testWrongBtn.addEventListener('click', () => {
      letters.length = 0;
      letters.push('D', 'O', 'G');
      updateLetterDisplay();
      triggerWrongState();
    });

    testRightBtn.addEventListener('click', () => {
      letters.length = 0;
      letters.push('C', 'A', 'T');
      updateLetterDisplay();
      triggerCorrectState();
    });

    // Audio micro-interactions
    ttsButton.addEventListener('click', () => {
      ttsButton.classList.add('scale-95');
      setTimeout(() => ttsButton.classList.remove('scale-95'), 150);
      feedbackBanner.className = 'w-full min-h-[48px] rounded-xl flex items-center justify-center px-4 py-2 text-center transition-all duration-300 opacity-100 bg-surface-container-highest text-on-surface shadow-[0_2px_0_0_#bccae0]';
      feedbackText.innerHTML = '🔊 <em>"What animal is this? Spell its name!"</em>';
    });

    hintAudioButton.addEventListener('click', () => {
      hintAudioButton.classList.add('scale-95');
      setTimeout(() => hintAudioButton.classList.remove('scale-95'), 150);
      feedbackBanner.className = 'w-full min-h-[48px] rounded-xl flex items-center justify-center px-4 py-2 text-center transition-all duration-300 opacity-100 bg-tertiary-fixed text-on-tertiary-fixed shadow-[0_2px_0_0_#bfa3eb]';
      feedbackText.innerHTML = '🐱 <em>"Meooww! I like milk and fish!"</em>';
    });

  })();
</script></main>
